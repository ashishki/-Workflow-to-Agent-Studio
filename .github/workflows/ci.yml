name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    name: Python checks
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check required planning docs
        run: |
          test -f README.md
          test -f docs/spec.md
          test -f docs/tasks.md
          test -f docs/ARCHITECTURE.md
          test -f docs/IMPLEMENTATION_CONTRACT.md
          test -f docs/audit/PHASE1_AUDIT.md

      - name: Check Phase 1 audit status
        run: grep -q "^PHASE1_AUDIT: PASS$" docs/audit/PHASE1_AUDIT.md

      - name: Check shell hooks syntax
        run: bash -n hooks/*.sh

      - name: Check trailing whitespace
        run: |
          ! grep -RIn --include="*.md" --include="*.yml" --include="*.yaml" \
            "[[:blank:]]$" README.md PLAYBOOK.md docs .github ci prompts templates

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
          python -m pip install -e .

      - name: Ruff check
        run: ruff check workflow_agent_studio tests/

      - name: Ruff format check
        run: ruff format --check workflow_agent_studio tests/

      - name: Pytest
        run: python -m pytest tests/ -q
