name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python checks
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Scan repository history for secrets
        env:
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_ARCHIVE_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
        run: |
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          curl --fail --location --silent --show-error \
            --output "$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_ARCHIVE_SHA256}  ${archive}" | sha256sum --check
          tar -xzf "$archive" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" git --no-banner --redact=100 .

      - name: Set up Python 3.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Check required planning docs
        run: |
          test -f README.md
          test -f docs/spec.md
          test -f docs/tasks.md
          test -f docs/ARCHITECTURE.md
          test -f docs/IMPLEMENTATION_CONTRACT.md
          test -f docs/audit/PHASE1_AUDIT.md

      - name: Check Phase 1 audit status
        run: |
          grep -q "^PHASE1_AUDIT: PASS$" docs/audit/PHASE1_AUDIT.md

      - name: Check shell hooks syntax
        run: bash -n hooks/*.sh

      - name: Check trailing whitespace
        run: |
          if git grep -nI -E "[[:blank:]]$" -- "*.md" "*.yml" "*.yaml"; then
            echo "Trailing whitespace found in tracked documentation or YAML."
            exit 1
          fi

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
          python -m pip install -e .

      - name: Ruff check
        run: ruff check workflow_agent_studio tests/ scripts/

      - name: Ruff format check
        run: ruff format --check workflow_agent_studio tests/ scripts/

      - name: Pytest
        run: python -m pytest tests/ -q
